<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Сканер файлов{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% set ep = request.endpoint or '' %}
<header class="top">
  <div class="bar">
    <a class="brand" href="{{ url_for('index') }}">Сканер файлов</a>
    <nav>
      <a href="{{ url_for('index') }}" class="{{ 'active' if ep in ('index', 'scan_page') }}">Сканирования</a>
      <a href="{{ url_for('run_page') }}" class="{{ 'active' if ep == 'run_page' }}">Запуск скана</a>
      <a href="{{ url_for('reports_index') }}" class="{{ 'active' if ep.startswith('report') }}">Отчёты</a>
      <a href="{{ url_for('files') }}" class="{{ 'active' if ep in ('files', 'file_page') }}">Поиск файлов</a>
    </nav>
  </div>
</header>
<main>{% block content %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body>
</html>
